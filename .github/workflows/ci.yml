name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Smoke scan fixture
        run: |
          set +e
          node packages/cli/dist/index.js scan --config fixtures/configs/bad-mcp.json --no-discover --format json --no-color
          bad_code=$?
          node dist/mcp-pordego.cjs scan --config /tmp/mcp-pordego-missing.json --no-discover
          missing_code=$?
          set -e
          test "$bad_code" -eq 1
          test "$missing_code" -eq 2
          node dist/mcp-pordego.cjs scan --config fixtures/configs/good-mcp.json --no-discover --fail-on high --no-color
